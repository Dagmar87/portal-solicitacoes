services:

  postgres:
    image: postgres:16
    container_name: portal-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: portal_solicitacoes
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d portal_solicitacoes"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: ./backend

    container_name: portal-backend

    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 3000

      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: portal_solicitacoes
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres

      JWT_SECRET: chave-super-secreta-do-projeto

    ports:
      - "3000:3000"

    depends_on:
      postgres:
        condition: service_healthy


  frontend:
    build:
      context: ./frontend

    container_name: portal-frontend

    restart: unless-stopped

    ports:
      - "5173:5173"

    depends_on:
      - backend


volumes:
  postgres_data: